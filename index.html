ชนโคกหม้อ ลพบุรี (RC)", "contract": "สัญญาเครื่องชงกาแฟ 1 เดือน", "device": "Gaggia รุ่น La Solare", "item": "Serial Number", "serial": "42720855"}, {"code": "23258", "name": "ป่าโมก อ่างทอง (RC)", "contract": "สัญญาเครื่องชงกาแฟ 1 เดือน", "device": "Gaggia รุ่น La Solare", "item": "Serial Number", "serial": "50720522"}];
const CONTRACT_CAFE='สัญญาเครื่องชงกาแฟ 1 เดือน';
const CONTRACT_SELECT='เครื่องชง ALL Cafe Select  1 เดือน';
const q=document.getElementById('query'), sugg=document.getElementById('suggestions');
let chosen=null;
function norm(s){return String(s||'').toLocaleLowerCase().replace(/\\s+/g,' ').trim()}
function branchGroups(){
 const m=new Map();
 DATA.forEach(r=>{let k=r.code+'|'+r.name;if(!m.has(k))m.set(k,{code:r.code,name:r.name,items:[]});m.get(k).items.push(r)});
 return [...m.values()];
}
const BRANCHES=branchGroups();
function matches(text){const n=norm(text);if(!n)return [];return BRANCHES.filter(b=>norm(b.code).includes(n)||norm(b.name).includes(n)).sort((a,b)=>{let aa=norm(a.code)===n||norm(a.name)===n?0:1,bb=norm(b.code)===n||norm(b.name)===n?0:1;return aa-bb||a.name.localeCompare(b.name,'th')}).slice(0,12)}
function showSuggestions(){const list=matches(q.value);sugg.innerHTML='';if(!q.value.trim()||!list.length){sugg.style.display='none';return}
 list.forEach(b=>{const d=document.createElement('div');d.className='suggestion';d.innerHTML='<b>'+esc(b.code)+' — '+esc(b.name)+'</b><small>'+b.items.length+' รายการสัญญา</small>';d.onclick=()=>{chosen=b;q.value=b.code+' — '+b.name;sugg.style.display='none';render(b)};sugg.appendChild(d)});sugg.style.display='block'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
q.addEventListener('input',()=>{chosen=null;showSuggestions()});q.addEventListener('focus',showSuggestions);
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))sugg.style.display='none'});
document.getElementById('searchBtn').onclick=()=>{if(chosen){render(chosen);return}const list=matches(q.value);if(list.length){chosen=list[0];q.value=chosen.code+' — '+chosen.name;sugg.style.display='none';render(chosen)}else{document.getElementById('result').classList.add('hidden');document.getElementById('empty').textContent='ไม่พบข้อมูลสาขา กรุณาตรวจสอบรหัสหรือชื่อสาขา';document.getElementById('empty').classList.remove('hidden')}};
function contractType(r){const c=norm(r.contract);if(c.includes('all cafe select'))return 'select';if(c===norm(CONTRACT_CAFE))return 'cafe';return c.includes('select')?'select':'cafe'}
function render(b){
 document.getElementById('empty').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
 const cafe=b.items.filter(r=>contractType(r)==='cafe'),sel=b.items.filter(r=>contractType(r)==='select');
 const panels=document.getElementById('panels');panels.innerHTML='';
 if(cafe.length)panels.appendChild(makePanel(cafe,'cafe','All Cafe','brown'));
 if(sel.length)panels.appendChild(makePanel(sel,'select','All Select','blue'));
 document.getElementById('details').innerHTML='';
 // Show the common branch details once, followed by serial number for each available contract.
 const rows=[['รหัสสาขา',b.code,'code'],['ชื่อสาขา',b.name,'name']];
 const deviceRows=[];
 [...cafe,...sel].forEach(r=>{if(!deviceRows.some(x=>x.contract===r.contract&&x.device===r.device))deviceRows.push(r)});
 const contracts=[...new Set([...cafe,...sel].map(r=>r.contract))];
 if(contracts.length===1)rows.push(['ชื่อสัญญ',contracts[0],'']);
 else rows.push(['ชื่อสัญญ','มี '+contracts.length+' สัญญา','']);
 const devices=[...new Set(deviceRows.map(r=>r.device).filter(Boolean))];
 rows.push(['อุปกรณ์',devices.join(' / '),'']);
 const detail=document.getElementById('details');
 rows.forEach(([label,value,cls])=>{const t=document.createElement('table');t.innerHTML='<tbody><tr class="'+cls+'"><td>'+esc(label)+'</td><td>'+esc(value)+'</td></tr></tbody>';detail.appendChild(t)});
 if(cafe.length)detail.appendChild(contractTable(cafe,'All Cafe'));
 if(sel.length)detail.appendChild(contractTable(sel,'All Select'));
}
function makePanel(items,type,label,color){
 const p=document.createElement('div');p.className='panel';
 const serials=[...new Set(items.map(r=>r.serial).filter(Boolean))];
 p.innerHTML='<div class="serial '+color+'"><span>Serial Number</span><span>'+serials.map(esc).join('<br>')+'</span></div><button class="copy" type="button">คัดลอก Serial Number</button><div class="brand '+color+'">'+label+'</div>';
 p.querySelector('button').onclick=()=>copyText(serials.join('\n'));return p;
}
function contractTable(items,label){
 const t=document.createElement('table');let html='<tbody>';
 items.forEach(r=>{html+='<tr><td>ชื่อสัญญ</td><td>'+esc(r.contract)+'</td></tr><tr><td>อุปกรณ์</td><td>'+esc(r.device)+'</td></tr><tr class="serialrow"><td>Serial Number</td><td>'+esc(r.serial)+'</td></tr>'});
 t.innerHTML=html+'</tbody>';return t;
}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const toast=document.getElementById('toast');toast.style.display='block';setTimeout(()=>toast.style.display='none',1500)}
</script></body></html>
